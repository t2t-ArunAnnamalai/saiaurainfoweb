<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Update</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
    }

    .card {
        background: linear-gradient(135deg, #c62828, #f5a623);
        padding: 70px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        max-width: 650px;
        width: 95%;
        color: white;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
        animation: fadeIn 1.5s ease;
    }

    .logo {
        width: 180px;
        margin-bottom: 25px;
        background: white;
        padding: 10px;
        border-radius: 12px;
    }

    .title {
        white-space: nowrap;
        font-size: clamp(20px, 3vw, 30px);
        margin-bottom: 20px;
        text-align: center;
    }

    /* 🔥 Dark Styled Stay Tuned */
    .main-text {
        font-size: 22px;
        font-weight: bold;
        font-style: italic;
        color: #4a1c1c;   /* dark color */
        letter-spacing: 1px;
        margin-bottom: 12px;
    }

    .sub-text {
        font-size: 18px;
        color: #ffe0b2;
        margin-bottom: 15px;
    }

    .highlight {
        font-size: 15px;
        color: #fff3e0;
        margin-top: 10px;
        font-style: italic;
    }

    .btn {
        margin-top: 25px;
        padding: 14px 35px;
        border: none;
        border-radius: 30px;
        background: white;
        color: #c62828;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ffe0b2;
        transform: scale(1.08);
    }

    .btn:active {
        transform: scale(0.95);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="card">
    
    <!-- Replace with your logo -->
    <img src="logo.png" alt="Company Logo" class="logo">

    <h1 class="title">🚧 WE'RE UPDATING OUR WEB PORTAL</h1>

    <div class="main-text">Stay Tuned</div>

    <div class="sub-text">Will Be Back Soon</div>

    <div class="highlight">
        Exciting things are on the horizon,<br>
        stay tuned for something amazing!
    </div>

    <button class="btn" onclick="location.reload()">🔄 Refresh</button>

</div>

</body>
</html>
