<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinewoods - Coming Soon</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f59e0b, #dc2626);
        color: white;
    }

    .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        padding: 50px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        max-width: 420px;
        width: 90%;
        animation: fadeIn 1.5s ease;
    }

    .logo {
        width: 140px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    p {
        font-size: 16px;
        opacity: 0.9;
        margin-bottom: 10px;
    }

    .btn {
        margin-top: 20px;
        padding: 12px 28px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(45deg, #fbbf24, #dc2626);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="card">
    <!-- Replace with your logo file -->
    <img src="logo.png" class="logo" alt="Shinewoods Logo">

    <h1>🚧 Coming Soon</h1>
    <p>Shinewoods website is under construction.</p>
    <p>We’re building something amazing for you!</p>

    <button class="btn" onclick="location.reload()">Refresh</button>
</div>

</body>
</html>
